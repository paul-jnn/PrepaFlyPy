[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prepaflypy"
version = "0.3.7"
description = "Assistant de préparation de vol drone (SORA 2.5, régimes FR/EU, base DJI, formulaires, MANEX). Éditeur : M.G.I."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "M.G.I. — Maintenance Générale Industrielle" }]
keywords = ["drone", "uas", "sora", "dgac", "easa", "flight-preparation"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "platformdirs>=4.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "staticmap>=0.5.5",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
prepafly = "prepafly.cli:main"

[project.urls]
Homepage = "https://github.com/paul-jnn/PrepaFlyPy"
Source = "https://github.com/paul-jnn/PrepaFlyPy"

[tool.setuptools.packages.find]
include = ["prepafly*"]

[tool.setuptools.package-data]
prepafly = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
