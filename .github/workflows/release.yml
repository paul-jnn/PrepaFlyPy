name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances système (Linux, pour pywebview)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 || true

      - name: Installer le projet et PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,desktop]"

      - name: Tests
        run: pytest -q

      - name: Construire l'exécutable
        run: pyinstaller prepafly.spec

      # --- Windows : exécutable portable + installateur Inno Setup ---
      - name: Préparer l'exécutable portable (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p out
          cp dist/PrepaFlyPy.exe out/PrepaFlyPy-windows.exe

      - name: Installer Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: Construire l'installateur (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss

      # --- Linux : exécutable ---
      - name: Préparer l'exécutable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p out
          cp dist/PrepaFlyPy out/PrepaFlyPy-linux

      - name: Publier dans la release (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/PrepaFlyPy-windows.exe
            installer_out/PrepaFlyPy-Setup.exe
          name: "PrepaFlyPy ${{ github.ref_name }}"
          body: "Installateur Windows (PrepaFlyPy-Setup.exe) recommandé. Exécutable portable Windows et Linux également fournis."
          draft: false
          prerelease: false

      - name: Publier dans la release (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: out/PrepaFlyPy-linux
          name: "PrepaFlyPy ${{ github.ref_name }}"
          draft: false
          prerelease: false
