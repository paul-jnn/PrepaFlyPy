<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrepaFlyPy</title>
<link rel="icon" href="/static/logo.png">
<link rel="apple-touch-icon" href="/static/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* =============================================================================
   PrepaFlyPy — interface web (servie par l'API FastAPI).
   Aucune logique métier ici : chaque action appelle une route /api/... et affiche
   la réponse. Le style et les composants (cartes, accordéons, champs) reprennent
   ceux de l'application Tauri pour la cohérence.
   ============================================================================= */
:root{
  --bleu:#1b3a6b; --bleu2:#2f6fb0; --bord:#d3ddea; --gris:#555f6d; --gris2:#8a97a6;
  --texte:#222a35; --vert:#1f8a4c; --vert-clair:#e5f5ec; --fond:#eef3f9; --rouge:#c0392b;
  --orange:#d98a1f; --jaune:#e9c93a;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte)}
button{font-family:inherit;cursor:pointer}
h1,h2{margin:0}
/* --- Verrou PIN --- */
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1b3a6b,#2f6fb0);display:flex;align-items:center;justify-content:center;z-index:100}
#lock .box{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:34px 38px;width:360px;text-align:center}
#lock .logo{font-size:42px}
#lock h1{color:var(--bleu);font-size:20px;margin:6px 0}
#lock p{color:var(--gris);font-size:13.5px}
#lock input{width:100%;padding:11px;border:1px solid var(--bord);border-radius:9px;font-size:18px;text-align:center;letter-spacing:4px;margin:8px 0}
#lock .err{color:var(--rouge);font-size:12.5px;min-height:16px}
/* --- Cadre app --- */
#app{display:none;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#12294d;color:#cdddf2;padding:16px 0;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{font-weight:700;color:#fff;font-size:16px;padding:6px 20px 14px;display:flex;align-items:center;gap:8px}
.side a{display:block;padding:11px 20px;color:#cdddf2;text-decoration:none;font-size:14px;border-left:3px solid transparent}
.side a:hover{background:#183358}
.side a.on{background:#0e2140;border-left-color:var(--bleu2);color:#fff;font-weight:600}
.side .sep{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#7b93b5;padding:14px 20px 4px}
.side .foot{font-size:11px;color:#7b93b5;padding:14px 20px}
.side .savestate{font-size:12px;color:#9fc0e6;padding:6px 20px}
.main{padding:26px 30px;max-width:1000px}
.page-h{font-size:22px;color:var(--bleu);margin-bottom:2px}
.page-sub{color:var(--gris);font-size:13.5px;margin:0 0 18px}
/* --- Cartes --- */
.card{background:#fff;border:1px solid var(--bord);border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(20,40,70,.04)}
.card>h2{font-size:16px;color:var(--bleu);margin:0 0 2px}
.card>.kick{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--bleu2)}
.card>.desc{color:var(--gris);font-size:13px;margin:0 0 14px}
.card.coll{padding:0;overflow:hidden}
.card.coll .coll-head{display:flex;align-items:center;gap:12px;padding:16px 22px;cursor:pointer;user-select:none}
.card.coll .coll-head:hover{background:#f7faff}
.card.coll .coll-head .chev{color:var(--gris2);font-size:11px;transition:transform .15s}
.card.coll.open .coll-head .chev{transform:rotate(90deg)}
.card.coll .coll-title{flex:1;min-width:0}
.card.coll .coll-title .kick{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--bleu2)}
.card.coll .coll-title h2{font-size:16px;color:var(--bleu);margin:0}
.card.coll .coll-body{padding:16px 22px 20px;border-top:1px solid var(--bord)}
/* --- Champs --- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 16px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--gris);font-weight:600}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--bord);border-radius:9px;font-size:13.5px;font-family:inherit;background:#fff}
.field input[readonly]{background:#f2f6fb;color:var(--gris)}
/* Exemple grisé dans les champs vides : disparaît dès qu'on saisit du texte. */
.field input::placeholder,.field textarea::placeholder,.row-actions input::placeholder{color:var(--gris2);font-style:italic;opacity:1}
.btn{padding:9px 15px;border:1px solid var(--bord);border-radius:9px;background:#fff;color:var(--texte);font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--bleu2)}
.btn.primary{background:var(--bleu2);border-color:var(--bleu2);color:#fff}
.btn.primary:hover{background:var(--bleu)}
.btn.danger{color:var(--rouge);border-color:#e6c3c0}
.btn.sm{padding:5px 10px;font-size:12px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.b-green{background:var(--vert-clair);color:var(--vert)} .b-red{background:#fbe6e4;color:var(--rouge)}
.b-orange{background:#fbf0dc;color:var(--orange)} .b-grey{background:#eef1f5;color:var(--gris)}
.b-yellow{background:#fbf6d6;color:#98871a} .b-blue{background:#e6effb;color:var(--bleu2)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--bord);background:#fff;color:var(--gris);border-radius:20px;padding:5px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--bleu2);border-color:var(--bleu2);color:#fff}
.note{color:var(--gris);font-size:12.5px;margin-top:8px}
.warn{background:#fbf0dc;border:1px solid #f0d9a8;color:#8a6414;border-radius:9px;padding:10px 12px;font-size:13px;margin-top:10px}
.result{display:flex;gap:16px;background:#f7faff;border:1px solid #e0eaf7;border-radius:10px;padding:14px;align-items:center}
.result .big{font-size:26px;font-weight:800;color:var(--bleu)}
.result .lbl{font-size:11px;color:var(--gris);text-transform:uppercase}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--bord)}
.tab{padding:9px 14px;border:none;background:none;font-size:13.5px;color:var(--gris);border-bottom:2px solid transparent}
.tab.on{color:var(--bleu);border-bottom-color:var(--bleu2);font-weight:700}
.acc{border:1px solid var(--bord);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc-head{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer;user-select:none}
.acc-head:hover{background:#f7faff}
.acc-head .chev{color:var(--gris2);font-size:11px;transition:transform .15s}
.acc.open .acc-head .chev{transform:rotate(90deg)}
.acc-head .nm{flex:1;font-weight:600;font-size:14.5px}
.acc-body{padding:0 16px 16px;border-top:1px solid var(--bord)}
.linklist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linklist a{display:flex;gap:10px;align-items:center;border:1px solid var(--bord);border-radius:10px;padding:11px 13px;text-decoration:none;color:var(--texte)}
.linklist a:hover{border-color:var(--bleu2);background:#f7faff}
.linklist .ic{font-size:20px}
.linklist small{display:block;color:var(--gris);font-size:11.5px}
.ck{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13.5px}
.pdfmodal,.mapmodal{position:fixed;inset:0;z-index:75;background:rgba(20,40,70,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.pdfbox,.mapbox{background:#fff;border-radius:12px;width:min(1000px,100%);height:88vh;display:flex;flex-direction:column;overflow:hidden}
.pdfhead{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bord)}
.pdfhead b{flex:1;color:var(--bleu);font-size:13.5px}
.pdfframe{flex:1;border:none}
#map{flex:1}
.updbar{background:#0e2140;color:#fff;padding:8px 16px;font-size:13px;display:flex;gap:12px;align-items:center}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.langbtn{border:1px solid var(--bord);background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--gris)}
.langbtn.on{background:var(--bleu2);color:#fff;border-color:var(--bleu2)}
@media(max-width:820px){#app{grid-template-columns:1fr}.side{position:static;height:auto}.grid,.grid3,.linklist{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <img class="logo" src="/static/logo.png" alt="PrepaFlyPy" style="width:64px;height:64px;border-radius:14px">
    <h1 id="lockTitle">PrepaFlyPy</h1>
    <p id="lockText">Chargement…</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" style="display:none">
    <input id="pin2" type="password" inputmode="numeric" maxlength="8" placeholder="Confirmer" style="display:none">
    <div class="err" id="lockErr"></div>
    <button class="btn primary" id="lockBtn" style="display:none;width:100%">Valider</button>
  </div>
</div>

<div id="app">
  <nav class="side" id="side"></nav>
  <div>
    <div id="updbar"></div>
    <main class="main" id="view"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
